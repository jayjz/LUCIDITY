# LUCIDITY base Codex configuration.
# Account authentication and model availability are intentionally excluded.
# Install as $CODEX_HOME/config.toml only after reviewing the generated diff.

approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"

# Keep the global contract concise while allowing richer project instructions.
project_doc_max_bytes = 65536

# Multi-agent behavior intentionally follows the current Codex default until
# P6 evaluates whether LUCIDITY needs explicit limits, models, or custom roles.
